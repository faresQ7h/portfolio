<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project | Fares Mohamed</title>
  <meta name="description" content="Project detail page for Fares Mohamed's software engineering portfolio.">
  <meta property="og:title" content="Project | Fares Mohamed">
  <meta property="og:description" content="Architecture, technologies, challenges, and lessons learned from a software project by Fares Mohamed.">
  <meta property="og:type" content="article">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0a1626">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/site.css">
  <script src="/js/github-button.js" defer></script>
  <script src="/js/project.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="nav container" aria-label="Project navigation">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">FM</span>
        <span class="brand-name">Fares Mohamed</span>
      </a>
      <div class="nav-links visible">
        <a href="/#projects">Projects</a>
        <a href="/#contact">Contact</a>
      </div>
    </nav>
  </header>

  <main id="main" class="project-detail" data-project-detail>
    <section class="section project-hero">
      <div class="container project-detail-grid">
        <div>
          <a class="text-link back-link" href="/#projects"><span aria-hidden="true">&larr;</span> Back to projects</a>
          <p class="eyebrow" data-project-status></p>
          <h1 data-project-name>Loading project</h1>
          <p class="headline" data-project-description></p>
          <div class="tag-row" data-project-technologies></div>
          <div class="hero-actions" data-project-actions></div>
        </div>
        <div class="project-gallery" data-project-gallery>
          <div class="project-gallery-hero">
            <img class="project-shot large" data-project-image alt="" width="720" height="420" loading="eager">
            <button class="gallery-arrow gallery-arrow-prev" type="button" data-gallery-prev aria-label="Previous screenshot" hidden>&#10094;</button>
            <button class="gallery-arrow gallery-arrow-next" type="button" data-gallery-next aria-label="Next screenshot" hidden>&#10095;</button>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container detail-sections" data-detail-sections></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <p>&copy; <span data-year></span> Fares Mohamed</p>
      <a href="/">Home</a>
    </div>
  </footer>
</body>
</html>
